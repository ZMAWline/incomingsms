name: Dashboard PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/dashboard/**'
      - 'src/shared/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dashboard-pr-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dashboard-shared-preview
  cancel-in-progress: true

env:
  PREVIEW_URL: https://dashboard-test.zalmen-531.workers.dev

jobs:
  deploy-preview:
    name: Deploy shared dashboard preview
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Install test bundler
        run: npm install --no-save esbuild

      - name: Run dashboard-safe tests
        run: npm test

      - name: Dry-run dashboard test deploy
        run: npx wrangler deploy --config src/dashboard/wrangler.toml --env test --dry-run

      - name: Deploy dashboard test preview
        run: npx wrangler deploy --config src/dashboard/wrangler.toml --env test

      - name: Smoke-test preview auth challenge
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dashboard-preview-body.txt -w '%{http_code}' --max-time 30 "$PREVIEW_URL/")
          test "$code" = "401"
          grep -qi 'WWW-Authenticate' <(curl -sS -I --max-time 30 "$PREVIEW_URL/")

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const sha = '${{ github.event.pull_request.head.sha }}';
            const body = [
              'Ready to review preview deployed.',
              '',
              `Preview URL: ${previewUrl}`,
              `Commit: ${sha}`,
              '',
              'What to test:',
              '- Log in with the dashboard test credentials.',
              '- Exercise the changed dashboard flow.',
              '- Confirm API calls use dashboard test service bindings, not production.',
              '',
              'Safety: this shared preview deploys with `src/dashboard/wrangler.toml` `[env.test]`, preserving the existing Cloudflare Worker secrets already attached to `dashboard-test` and binding service calls to `*-test` workers.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  note-preview-closed:
    name: Note shared preview on close
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Comment shared preview behavior
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'PR closed. Shared dashboard preview remains available for the next review deploy: https://dashboard-test.zalmen-531.workers.dev',
            });
