name: Dashboard PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/dashboard/**'
      - 'src/bulk-activator/**'
      - 'src/shared/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dashboard-pr-preview.yml'
  workflow_dispatch:
    inputs:
      deploy_live_test:
        description: 'Also overwrite the shared live *-test workers (needed only to exercise service bindings)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

# Per-PR, not global. Previews are per-version now, so two PRs no longer contend
# for one target and must not cancel each other's runs. The old shared group
# meant a second PR silently killed the first PR's in-flight check.
concurrency:
  group: dashboard-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BULK_ACTIVATOR_TEST_URL: https://bulk-activator-test.zalmen-531.workers.dev

jobs:
  deploy-preview:
    name: Deploy dashboard preview
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Overwriting the shared live test workers is opt-in. It is only needed to
      # exercise a service binding, because a preview version's bindings resolve
      # to the *live* bound worker — a dashboard preview always calls the live
      # bulk-activator-test, never a preview of it.
      DEPLOY_LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_live_test) || contains(github.event.pull_request.labels.*.name, 'deploy-test') }}
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Install test bundler
        run: npm install --no-save esbuild

      - name: Run dashboard-safe tests
        run: npm test

      - name: Dry-run dashboard test deploy
        run: npx wrangler deploy --config src/dashboard/wrangler.toml --env test --dry-run

      # `versions upload` publishes a build and returns its own immutable URL
      # WITHOUT changing what dashboard-test serves.
      #
      # This step used to be `wrangler deploy --env test`, which overwrote the
      # one shared dashboard-test on every PR push. With several PRs open,
      # whoever pushed last owned the test dashboard: on 2026-09-09 a run on
      # fix/retry-portin-reason-text replaced another branch's build and served
      # the wrong dashboard for ~40 minutes. The version inherits every secret
      # and binding, so nothing needs re-provisioning.
      - name: Upload dashboard preview version
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config src/dashboard/wrangler.toml --env test 2>&1 | tee /tmp/upload.log
          url=$(grep -oE 'https://[0-9a-f-]+-dashboard-test\.[a-z0-9.-]+workers\.dev' /tmp/upload.log | head -1)
          if [ -z "$url" ]; then
            echo "Could not parse a preview URL from wrangler output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"

      # An anonymous caller must get the sign-in page and never the SPA, and the
      # API must stay shut. Until PR #94 this asserted 401 + WWW-Authenticate;
      # named logins replaced the Basic challenge with a login page, and the old
      # assertion then failed on every dashboard PR.
      - name: Smoke-test preview auth challenge
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dashboard-preview-body.txt -w '%{http_code}' --max-time 30 "$PREVIEW_URL/")
          test "$code" = "200"
          grep -qi '<title>Sign in</title>' /tmp/dashboard-preview-body.txt
          if grep -qi 'id="sims-table"' /tmp/dashboard-preview-body.txt; then
            echo "SPA markup served without authentication" >&2
            exit 1
          fi
          api=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PREVIEW_URL/api/sims")
          test "$api" = "401"

      - name: Dry-run bulk-activator test deploy
        run: npx wrangler deploy --config src/bulk-activator/wrangler.toml --env test --dry-run

      # Opt-in only. dashboard-test proxies SIM activation to bulk-activator-test
      # over a service binding, and a preview cannot bind to a preview — so
      # exercising a bulk-activator change end to end still needs the live test
      # worker. Label the PR `deploy-test` when that is what you are doing, and
      # expect to overwrite the shared test environment for everyone.
      - name: Deploy live test workers (opt-in)
        if: env.DEPLOY_LIVE == 'true'
        env:
          DASHBOARD_AUTH: ${{ secrets.DASHBOARD_AUTH }}
        run: |
          set -euo pipefail
          # printf, never echo: echo appends a newline and corrupts the secret
          # (constraints.md #4).
          printf '%s' "$DASHBOARD_AUTH" | npx wrangler secret put DASHBOARD_AUTH --config src/dashboard/wrangler.toml --env test
          npx wrangler deploy --config src/dashboard/wrangler.toml --env test
          npx wrangler deploy --config src/bulk-activator/wrangler.toml --env test

      - name: Smoke-test bulk-activator returns JSON on auth failure
        if: env.DEPLOY_LIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/bulk-activator-preview-body.txt -w '%{http_code}' --max-time 30 \
            -X POST "$BULK_ACTIVATOR_TEST_URL/activate?secret=preview-smoke-test-invalid" \
            -H 'Content-Type: application/json' -d '{"sims":[]}')
          test "$code" = "401"
          python3 -c "import json; d=json.load(open('/tmp/bulk-activator-preview-body.txt')); assert d.get('ok') is False, d"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          DEPLOY_LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_live_test) || contains(github.event.pull_request.labels.*.name, 'deploy-test') }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const deployedLive = process.env.DEPLOY_LIVE === 'true';
            const sha = '${{ github.event.pull_request.head.sha }}';
            const body = [
              'Preview version uploaded.',
              '',
              `Preview URL: ${previewUrl}`,
              `Commit: ${sha}`,
              '',
              'What to test:',
              '- Sign in with the dashboard test credentials. This is a different hostname from `dashboard-test`, and the session cookie is host-only, so you will sign in once per preview URL. Same account, same database.',
              '- Exercise the changed dashboard flow.',
              '',
              'This URL belongs to this build alone. It does not change what `dashboard-test` serves, and another PR cannot overwrite it.',
              '',
              deployedLive
                ? 'This run also deployed the live `*-test` workers, because the PR is labelled `deploy-test`. The shared test environment now reflects this branch.'
                : 'The shared `dashboard-test` was left untouched. Service bindings on a preview resolve to the live `*-test` workers, so if you need to exercise a bulk-activator change end to end, label this PR `deploy-test` and re-run.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  note-preview-closed:
    name: Note preview on close
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview behavior
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'PR closed. This PR\'s preview versions stay reachable at their own URLs; nothing needs tearing down, and `dashboard-test` was never pointed at them.',
            });
