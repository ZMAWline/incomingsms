name = "otp-portal"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "5313f8b98e20a8915418b2683ad7278c"
workers_dev = true

[vars]
ASSIGNMENT_TTL_MINUTES = "60"

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (wrangler secret put): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OTP_PORTAL_TOKEN.
#
# OTP_PORTAL_TOKEN is the private path segment that gates the entire app
# (e.g. generate with `openssl rand -hex 24`). The page lives at
# https://<worker-host>/<OTP_PORTAL_TOKEN>/ — anyone without the token gets a
# plain 404, same as any other unknown route. Never commit the value.

# ============ TEST ENVIRONMENT ============
[env.test]
name = "otp-portal-test"

[env.test.vars]
ASSIGNMENT_TTL_MINUTES = "60"

[env.test.observability.logs]
enabled = true
invocation_logs = true
