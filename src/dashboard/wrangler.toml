name = "dashboard"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "5313f8b98e20a8915418b2683ad7278c"
workers_dev = true

# 12h Teltik hosting port-status sweep + 1-minute drain tick for durable
# Workers-page sweep jobs (scheduled handler in index.js distinguishes them).
[triggers]
crons = ["0 */12 * * *", "* * * * *"]

# DASHBOARD_ENV names the environment inside generated agent API keys
# (zmaw_live_… vs zmaw_test_…), so a key is self-identifying and a TEST key
# pasted at PROD is a format mismatch rather than a puzzling 401.

# ---------------------------------------------------------------------------
# Google Sheets export (POST /api/sims/export/google-sheet)
#
# GOOGLE_SERVICE_ACCOUNT_JSON — SECRET, not a var. The complete service-account
# key JSON (the file Google Cloud downloads when you add a key). The Worker
# reads client_email, private_key and the optional token_uri from it, mints an
# RS256 JWT and exchanges it for a token scoped to
# .../auth/spreadsheets + .../auth/drive. Enable the Google Sheets API and
# the Google Drive API on that service account's project first. Set it with:
#
#   cd src/dashboard
#   printf '%s' "$(cat ~/sa-key.json)" | npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON --env test
#   printf '%s' "$(cat ~/sa-key.json)" | npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON --env=""
#
# `--env test` targets dashboard-test, `--env=""` targets PROD dashboard. Never
# add `--name`: wrangler appends the env suffix to it and writes to a phantom
# script (see agent/current-state.md, PR #73). Never pipe with `echo` either —
# the trailing newline lands inside the secret and breaks the PEM parse.
#
# Never commit the key, and never paste it into a [vars] block — vars are
# plaintext in the deployed bundle. Until the secret exists the route answers
# 501 and the dashboard says "not configured yet".
#
# GOOGLE_SHEETS_PARENT_FOLDER_ID — REQUIRED var below. A Shared Drive ID, or
# the ID of a folder inside one, that the service account has been added to as
# Content manager. Every exported sheet is created in it. Required because a
# standalone service account gets zero Drive storage quota, so it cannot own a
# file anywhere else (spreadsheets.create 403s, Drive says
# storageQuotaExceeded); a Shared Drive is owned by the Workspace instead. Take
# the ID from the drive/folder URL: drive.google.com/drive/folders/<ID>. Unset
# → the route answers 501 naming this var.
#
# GOOGLE_SHEETS_SHARE_WITH — OPTIONAL var below, comma-separated email
# addresses that each get writer on every exported sheet (a shared ops inbox,
# for instance). Shared Drive members can already open the file; this and the
# type=anyone/role=writer grant are for operators who are not members. Both are
# best-effort — a Workspace policy that blocks anyone-links turns into a
# warning in the response, not a failed export. Leave unset to skip named
# sharing.
# ---------------------------------------------------------------------------
[vars]
# LEGACY_VENDORS = "helix,wing,skyline,kasa"  # off by default; set to re-enable, then deploy
WING_EXPECTED_RATE = "5.00"
DASHBOARD_ENV = "live"
# "Dashboard SIM exports" folder in the "Server Backups" Shared Drive; the
# dashboard-sheets-export service account is a member of that drive.
GOOGLE_SHEETS_PARENT_FOLDER_ID = "1OR3MQjiiEXPch37BPsEmDHHWKS1pFzF2"
# GOOGLE_SHEETS_SHARE_WITH = "ops@example.com,billing@example.com"

# Frontend (public/index.html + public/static/*) is deployed as static assets.
# run_worker_first keeps the worker's Basic-auth gate in front of EVERYTHING —
# assets are only reachable via env.ASSETS.fetch() after auth passes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true

# Service bindings for worker-to-worker communication
[[services]]
binding = "SIM_CANCELLER"
service = "sim-canceller"

[[services]]
binding = "BULK_ACTIVATOR"
service = "bulk-activator"

[[services]]
binding = "DETAILS_FINALIZER"
service = "details-finalizer"

[[services]]
binding = "MDN_ROTATOR"
service = "mdn-rotator"

[[services]]
binding = "PHONE_NUMBER_SYNC"
service = "phone-number-sync"

[[services]]
binding = "RESELLER_SYNC"
service = "reseller-sync"

[[services]]
binding = "SIM_STATUS_CHANGER"
service = "sim-status-changer"

[[services]]
binding = "SKYLINE_GATEWAY"
service = "skyline-gateway"

[[services]]
binding = "QUICKBOOKS"
service = "quickbooks"

[[services]]
binding = "TELTIK_WORKER"
service = "teltik-worker"

[[services]]
binding = "KASA_CONTROL"
service = "kasa-control"

[[services]]
binding = "BAD_RENTAL_REMEDIATOR"
service = "bad-rental-remediator"

# ============ TEST ENVIRONMENT ============
[env.test]
name = "dashboard-test"

# No automatic sweeps in test — manual /api/hosting-port-status/run only.
[env.test.triggers]
crons = []

[env.test.vars]
# LEGACY_VENDORS = "helix,wing,skyline,kasa"  # off by default; set to re-enable, then deploy
WING_EXPECTED_RATE = "5.00"
DASHBOARD_ENV = "test"
# Required for Google Sheets export, same meaning as the PROD
# GOOGLE_SHEETS_PARENT_FOLDER_ID above — a Shared Drive the service account
# belongs to, since the account itself has no Drive storage quota.
GOOGLE_SHEETS_PARENT_FOLDER_ID = "1OR3MQjiiEXPch37BPsEmDHHWKS1pFzF2"
# Optional, same meaning as the PROD GOOGLE_SHEETS_SHARE_WITH above.
# GOOGLE_SHEETS_SHARE_WITH = "ops@example.com"

[env.test.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[env.test.observability.logs]
enabled = true
invocation_logs = true

# Service bindings for TEST workers
[[env.test.services]]
binding = "SIM_CANCELLER"
service = "sim-canceller-test"

[[env.test.services]]
binding = "BULK_ACTIVATOR"
service = "bulk-activator-test"

[[env.test.services]]
binding = "DETAILS_FINALIZER"
service = "details-finalizer-test"

[[env.test.services]]
binding = "MDN_ROTATOR"
service = "mdn-rotator-test"

[[env.test.services]]
binding = "PHONE_NUMBER_SYNC"
service = "phone-number-sync-test"

[[env.test.services]]
binding = "RESELLER_SYNC"
service = "reseller-sync-test"

[[env.test.services]]
binding = "SIM_STATUS_CHANGER"
service = "sim-status-changer-test"

[[env.test.services]]
binding = "SKYLINE_GATEWAY"
service = "skyline-gateway-test"

[[env.test.services]]
binding = "QUICKBOOKS"
service = "quickbooks-test"

[[env.test.services]]
binding = "TELTIK_WORKER"
service = "teltik-worker-test"

[[env.test.services]]
binding = "KASA_CONTROL"
service = "kasa-control-test"

[[env.test.services]]
binding = "BAD_RENTAL_REMEDIATOR"
service = "bad-rental-remediator-test"
