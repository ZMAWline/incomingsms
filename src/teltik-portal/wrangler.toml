name = "teltik-portal"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "5313f8b98e20a8915418b2683ad7278c"
workers_dev = true

[vars]
LOGIN_SESSION_TTL_MINUTES = "720"

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (wrangler secret put): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# TELTIK_API_KEY, TELTIK_PORTAL_USERNAME, TELTIK_PORTAL_PASSWORD_HASH,
# TELTIK_PORTAL_SESSION_SECRET. Optional: RELAY_URL, RELAY_KEY (egress relay,
# same as every other worker that calls Teltik/vendor APIs).
#
# The page lives at the plain worker root, e.g.
# https://teltik-portal.<subdomain>.workers.dev/ — it shows a login form and
# only serves hosted-line status once signed in. This is the page meant to be
# shared with Teltik directly (give them TELTIK_PORTAL_USERNAME/password) —
# NOT the internal admin dashboard, whose Basic Auth covers everything.
#
# TELTIK_PORTAL_USERNAME is the shared login username, matched case-
# insensitively (trimmed + ASCII-folded, constant-time compare on both
# sides).
#
# TELTIK_PORTAL_PASSWORD_HASH is a PBKDF2 hash of the shared login password
# in the format produced by src/teltik-portal/auth.mjs#hashPassword
# ("pbkdf2$<iterations>$<salt_b64>$<hash_b64>") — never store the plaintext
# password itself. To generate one:
#   node --input-type=module -e "import('./src/teltik-portal/auth.mjs').then(a=>a.hashPassword(process.argv[1])).then(console.log)" '<the password>'
# then `wrangler secret put TELTIK_PORTAL_PASSWORD_HASH` with the result.
#
# TELTIK_PORTAL_SESSION_SECRET signs the login session cookie
# (`openssl rand -hex 32`). Rotating it invalidates all existing sessions.
#
# TELTIK_API_KEY is the same Teltik account API key used elsewhere
# (bad-rental-remediator, dashboard, teltik-worker) — reset-port and
# port-status calls from this portal count against the same Teltik account/
# rate limits as everything else.
#
# A wrong or missing username or password never reaches Supabase —
# verification is pure local constant-time compare / PBKDF2 / HMAC. Never
# commit any of these secret values.

# ============ TEST ENVIRONMENT ============
[env.test]
name = "teltik-portal-test"

[env.test.vars]
LOGIN_SESSION_TTL_MINUTES = "720"

[env.test.observability.logs]
enabled = true
invocation_logs = true
