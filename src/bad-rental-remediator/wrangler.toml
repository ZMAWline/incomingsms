name = "bad-rental-remediator"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "5313f8b98e20a8915418b2683ad7278c"
workers_dev = true

# Cron every 15m (Plan v4 §G baseline was 2h). The kill-switch KV `bad_rental_remediator_enabled`
# defaults missing/false until the classifier (INC-16b) and SMS verify (INC-16c)
# ship; until then the worker only classifies into shared situations and returns
# no_change for everything else.
[triggers]
# 15-min intake (§G; 2h -> */5 on 2026-06-12 so resellers wait minutes, not
# hours, for a fix; */5 -> */15 on 2026-08-06 per t_deb61006) + 1-min §C
# receive-poll for verify_pending reports (INC-19), which stays at */1 because
# the §C nonce window is only 5 min.
# Escalation batching still dedups on 2h tick_id slots (computeTickId), so the
# intake cadence does NOT change Paperclip ticket volume.
crons = ["*/15 * * * *", "*/1 * * * *"]

# Kill-switch + cooldown state. Same KV namespace as token cache for now to
# avoid bootstrapping a new namespace; the keyspace is namespaced by prefix
# (`bad_rental_remediator_*`).
[[kv_namespaces]]
binding = "REMEDIATOR_KV"
id = "edaf2c8828b14badb3037600635f8a7f"

# Vendor restore/refresh credentials (INC-21 / INC-16e) — set via
# `wrangler secret put ...`. Without them, the matching executor returns
# status='bad_input' with errorMessage '<vendor>_credentials_missing' and the
# tick continues. Required for live vendor calls:
#   ATOMIC_USERNAME, ATOMIC_TOKEN, ATOMIC_PIN          (A1 / A3)
#   ATOMIC_API_URL                                      (optional override)
#   WING_IOT_USERNAME, WING_IOT_API_KEY                 (W7)
#   WING_IOT_BASE_URL                                   (optional override)
#   HX_API_BASE, HX_TOKEN_URL, HX_CLIENT_ID, HX_AUDIENCE,
#   HX_GRANT_USERNAME, HX_GRANT_PASSWORD                (H3 / H4)
#   TELTIK_API_KEY                                      (T3 / T4 / T5)
#   RELAY_URL, RELAY_KEY                                (optional egress relay)
#
# SLACK_WEBHOOK_URL — Incoming Webhook URL for the #<channel> alert channel.
# Fires a Slack message from notify.mjs on TH5 offline detection (first
# detection) and again if the port is still offline after the auto-reset
# attempt (escalation). Missing/unset → notifyPortOffline no-ops (logs
# 'no_webhook', never throws). Dedup is internal (REMEDIATOR_KV), so this is
# safe to set at any time without a code change.
#   npx wrangler secret put SLACK_WEBHOOK_URL -c src/bad-rental-remediator/wrangler.toml --env ""
#
# INC-22 / INC-16f — Paperclip escalation API. When absent, escalation rows
# are still written to operator_escalations (status='queued', last_error=
# 'paperclip_credentials_missing') so an out-of-band drainer can post them.
#   PAPERCLIP_API_URL          base URL of the Paperclip control-plane API
#   PAPERCLIP_API_KEY          bearer token
#   ESCALATION_PARENT_ISSUE_ID optional INC-XX parent for the auto-generated batch issues
#
# STATUS 2026-08-06: neither secret has ever been set on this worker, so every
# escalation batch since 2026-06-09 sits queued/paperclip_credentials_missing.
# Project migration record: the project moved OFF Paperclip on 2026-07-02 to
# the `incomingsms` kanban board, so the operator-visible sink today is the
# pending_review_items inbox bridge in reserveEscalation, not this POST.
# Provision only if a Paperclip-compatible endpoint still exists:
#   npx wrangler secret put PAPERCLIP_API_URL -c src/bad-rental-remediator/wrangler.toml
#   npx wrangler secret put PAPERCLIP_API_KEY -c src/bad-rental-remediator/wrangler.toml
# Then drain the backlog in bounded batches (dry-run first — omit confirm=1):
#   curl -X POST "$WORKER/escalations/drain?secret=$ADMIN_RUN_SECRET&limit=25"
#   curl -X POST "$WORKER/escalations/drain?secret=$ADMIN_RUN_SECRET&limit=25&confirm=1"
# Depth is visible without credentials at GET /escalations/backlog and in
# /status -> escalation_backlog.
#
# Service bindings used during shared-situation classification.
# RESELLER_SYNC: resend webhook + check rental status (cancel-guard §E).
# SKYLINE_GATEWAY: gateway port-status for S5; /send-sms wired in INC-16c.
[[services]]
binding = "RESELLER_SYNC"
service = "reseller-sync"

[[services]]
binding = "SKYLINE_GATEWAY"
service = "skyline-gateway"

[observability.logs]
enabled = true
invocation_logs = true

# ============ TEST ENVIRONMENT ============
[env.test]
name = "bad-rental-remediator-test"

[env.test.triggers]
crons = []

[[env.test.kv_namespaces]]
binding = "REMEDIATOR_KV"
id = "689e9a6ec8c849cfb32bc5154cf8d680"

[[env.test.services]]
binding = "RESELLER_SYNC"
service = "reseller-sync-test"

[[env.test.services]]
binding = "SKYLINE_GATEWAY"
service = "skyline-gateway-test"

[env.test.observability.logs]
enabled = true
invocation_logs = true
